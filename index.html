<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Truck Condition Logger</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Harrod Truck Inspect">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c2e4a">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1c2e4a url('Background%20app%20image.jpg') no-repeat center top / cover;
      font-family: Arial, sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #install-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #install-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      padding: 22px 20px 18px;
      position: relative;
      text-align: center;
    }

    #close-install {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #eef1f5;
      color: #333;
      font-size: 22px;
      line-height: 38px;
      cursor: pointer;
    }

    #install-title {
      margin: 8px 40px 8px;
      font-size: 28px;
      line-height: 1.1;
      color: #114a96;
      font-weight: 700;
    }

    #install-text {
      margin: 0 auto 16px;
      font-size: 18px;
      line-height: 1.45;
      color: #2d3748;
      max-width: 320px;
    }

    #install-steps {
      text-align: left;
      background: #f7f9fc;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      line-height: 1.5;
      color: #1f2937;
    }

    #install-steps div {
      margin-bottom: 10px;
    }

    #install-steps div:last-child {
      margin-bottom: 0;
    }

    .install-highlight {
      font-weight: 700;
      color: #114a96;
    }

    #install-action {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      background: #114a96;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    #install-note {
      margin-top: 14px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div id="install-overlay">
    <div id="install-card">
      <button id="close-install" aria-label="Close">&times;</button>

      <div id="install-title">Install This App</div>
      <div id="install-text"></div>

      <div id="install-steps"></div>

      <button id="install-action">Install App</button>

      <div id="install-note">You only need to do this once.</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }

    const overlay = document.getElementById('install-overlay');
    const closeBtn = document.getElementById('close-install');
    const installText = document.getElementById('install-text');
    const installSteps = document.getElementById('install-steps');
    const installAction = document.getElementById('install-action');

    let deferredPrompt = null;
    let _redirected = false;

    function redirectToApp() {
      if (_redirected) return;
      _redirected = true;
      window.location.replace('https://script.google.com/macros/s/AKfycbyXrdf-GgefxsQSI6cBwlXZtQj54Rgv9ySNjBQ9Gh73ZnjMlQWnUtiGW2fQ-OxwG4-J8Q/exec');
    }

    function isIos() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    function isInStandaloneMode() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function hasDismissedInstallPrompt() {
      return localStorage.getItem('installPromptDismissed') === 'true';
    }

    function markInstallPromptDismissed() {
      localStorage.setItem('installPromptDismissed', 'true');
    }

    function showOverlay() {
      overlay.style.display = 'flex';
    }

    function hideOverlay() {
      overlay.style.display = 'none';
    }

    function setIosInstructions() {
      installText.textContent = 'Add this app to your Home Screen for faster access.';
      installSteps.innerHTML = `
        <div><span class="install-highlight">1.</span> Tap the <span class="install-highlight">Share</span> button in Safari.</div>
        <div><span class="install-highlight">2.</span> Scroll down.</div>
        <div><span class="install-highlight">3.</span> Tap <span class="install-highlight">Add to Home Screen</span>.</div>
      `;
      installAction.style.display = 'none';
    }

    function setAndroidInstructions() {
      installText.textContent = 'Install this app on your phone for quick access.';
      installSteps.innerHTML = `
        <div><span class="install-highlight">1.</span> Tap the button below.</div>
        <div><span class="install-highlight">2.</span> Follow the install prompt.</div>
      `;
      installAction.style.display = 'block';
      installAction.textContent = 'Install App';
    }

    function setAndroidManualInstructions() {
      installText.textContent = 'Add this app to your Home Screen for faster access.';
      installSteps.innerHTML = `
        <div><span class="install-highlight">1.</span> Tap the browser <span class="install-highlight">menu</span>.</div>
        <div><span class="install-highlight">2.</span> Tap <span class="install-highlight">Install App</span> or <span class="install-highlight">Add to Home Screen</span>.</div>
      `;
      installAction.style.display = 'none';
    }

    closeBtn.addEventListener('click', function() {
      hideOverlay();
      markInstallPromptDismissed();
      redirectToApp();
    });

    installAction.addEventListener('click', async function() {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      try {
        await deferredPrompt.userChoice;
      } catch (err) {
        console.log('Install prompt canceled or failed:', err);
      }

      deferredPrompt = null;
      hideOverlay();
      markInstallPromptDismissed();
      redirectToApp();
    });

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;

      if (!isInStandaloneMode() && !hasDismissedInstallPrompt() && isAndroid()) {
        setAndroidInstructions();
        showOverlay();
      }
    });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      hideOverlay();
      markInstallPromptDismissed();
      redirectToApp();
    });

    window.addEventListener('load', function() {
      if (isInStandaloneMode()) {
        hideOverlay();
        redirectToApp();
        return;
      }

      if (hasDismissedInstallPrompt()) {
        redirectToApp();
        return;
      }

      if (isIos()) {
        setIosInstructions();
        showOverlay();
        return;
      }

      if (isAndroid()) {
        if (!deferredPrompt) {
          setAndroidManualInstructions();
          showOverlay();
        }
        // else: beforeinstallprompt already showed its own overlay;
        // its Install/Close handlers call redirectToApp().
        return;
      }

      redirectToApp();
    });
  </script>
</body>
</html>
