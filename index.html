<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Truck Condition Logger</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Harrod Truck Inspect">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f0f2f5">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="https://harrodco.com/wp-content/uploads/2026/04/80-1.png">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f2f5;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #install-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #install-banner img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #install-banner button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      line-height: 36px;
      text-align: center;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbyXrdf-GgefxsQSI6cBwlXZtQj54Rgv9ySNjBQ9Gh73ZnjMlQWnUtiGW2fQ-OxwG4-J8Q/exec" allow="camera"></iframe>

  <div id="install-banner">
    <img src="ios-install.png" alt="Tap More then Share then Add to Home Screen">
    <button id="dismiss-btn" title="Close">&#x2715;</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const banner     = document.getElementById('install-banner');
    const dismissBtn = document.getElementById('dismiss-btn');

    function showBanner() { banner.style.display = 'flex'; }
    function hideBanner() { banner.style.display = 'none'; }

    dismissBtn.addEventListener('click', hideBanner);

    // Android / Chrome — show native prompt, fall back to image guide
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    });

    // iOS Safari
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = navigator.standalone === true;
    if (isIos && !isStandalone) {
      showBanner();
      setTimeout(hideBanner, 15000);
    }
  </script>
</body>
</html>
