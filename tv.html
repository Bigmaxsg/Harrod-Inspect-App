<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harrod TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    html, body { height: 100%; margin: 0; background: #0e1a2e; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; background: #0e1a2e; }
    iframe.on { visibility: visible; }
    #msg { padding: 40px; font-size: 1.2rem; }
    #count { position: fixed; top: 6px; right: 8px; z-index: 10; min-width: 54px; padding: 5px 10px; border-radius: 8px; background: #1565c0; border: 2px solid #fff; color: #fff; font-size: 1.15rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    #count.soon { background: #b71c1c; }
  </style>
</head>
<body>
  <script>
  // The one address the TV opens. Max: GPS 45 seconds, Fleet Live View for Frankfort 45 seconds, Bay View 45 seconds.
  // All three stay loaded and keep updating behind each other, so a swap is instant. visibility (not display:none) keeps
  // the map's size correct. To add a screen or change the time: edit SCREENS / SECONDS here; the TV picks it up at its
  // next reload below.
  var SECONDS = 45;
  var RELOAD_HOURS = 6;   // a browser left on for weeks slowly uses more memory; a reload also brings in page updates
  var key = (location.hash.match(/key=([^&]+)/) || location.search.match(/key=([^&]+)/) || [])[1] || '';
  // Max: each shop gets its own TV. Frankfort is .../tv#key=..., Lexington is .../tv?loc=Lexington#key=...
  var shop = /[?&]loc=lexington/i.test(location.search) ? 'Lexington' : 'Frankfort';
  var SCREENS = ['map?loc=' + shop + '#key=' + key, 'fleet?location=' + shop, 'bays?loc=' + shop + '#key=' + key];

  if (!key) {
    document.body.innerHTML = '<div id="msg">This link is not valid. Ask for the current TV link.</div>';
  } else {
    var frames = SCREENS.map(function (src) {
      var f = document.createElement('iframe');
      f.src = src;
      document.body.appendChild(f);
      return f;
    });
    // Max: a countdown top right so people know when the page is about to switch. It sits over each page's own top bar,
    // so that bar gets room on its right, or the countdown would cover "updated" and Fleet Live View's Refresh.
    frames.forEach(function (f) {
      f.addEventListener('load', function () {
        try {
          var d = f.contentDocument, bar = d.getElementById('top') || d.getElementById('top-bar');
          if (bar) bar.style.paddingRight = '90px';
        } catch (e) {}
      });
    });
    var count = document.createElement('div');
    count.id = 'count';
    document.body.appendChild(count);

    // One clock for both, so the number can never disagree with the switch.
    var at = 0, left = SECONDS;
    frames[0].className = 'on';
    function showCount() {
      count.textContent = left;
      count.className = left <= 5 ? 'soon' : '';
    }
    showCount();
    setInterval(function () {
      left--;
      if (left <= 0) {
        frames[at].className = '';
        at = (at + 1) % frames.length;
        frames[at].className = 'on';
        left = SECONDS;
      }
      showCount();
    }, 1000);
    setTimeout(function () { location.reload(); }, RELOAD_HOURS * 3600 * 1000);
  }
  </script>
</body>
</html>
