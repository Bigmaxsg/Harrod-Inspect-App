<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harrod TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="origin">
  <style>
    html, body { height: 100%; margin: 0; background: #0e1a2e; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
    body > iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; background: #0e1a2e; }
    body > iframe.on { visibility: visible; }   /* the old fixed rotation only */
    #msg { padding: 40px; font-size: 1.2rem; }
    #count { position: fixed; top: 6px; right: 8px; z-index: 10; min-width: 54px; padding: 5px 10px; border-radius: 8px; background: #1565c0; border: 2px solid #fff; color: #fff; font-size: 1.15rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    #count.soon { background: #b71c1c; }
    /* Harrod TV dashboard slides (?d=...). One layer per slide; only the one on screen is visible. */
    .layer { position: fixed; inset: 0; visibility: hidden; overflow: hidden; background: #0e1a2e; }
    .layer.on { visibility: visible; }
    /* inherit: a slide loading early (hidden layer) must not show through (Max: the next page opened over the current one) */
    .layer iframe { position: absolute; visibility: inherit; background: #fff; }
    .layer .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; border-radius: 1vh; }
    .layer img.pic { position: absolute; inset: 0; width: 100%; height: 100%; }
    .layer .txt { position: absolute; left: 4vw; right: 4vw; line-height: 1.15; font-weight: 800; white-space: pre-wrap; word-wrap: break-word; }
    .layer .txt span { display: inline-block; padding: 0.15em 0.4em; border-radius: 0.25em; }
    #idle { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; color: #8fa6c8; }
    #idle .clock { font-size: 14vh; font-weight: 300; color: #dfe8f5; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <script>
  var key = (location.hash.match(/key=([^&]+)/) || location.search.match(/key=([^&]+)/) || [])[1] || '';
  var display = (location.search.match(/[?&]d=([a-z0-9-]+)/i) || [])[1] || '';
  var RELOAD_HOURS = 6;   // a browser left on for weeks slowly uses more memory; a reload also brings in page updates

  if (!key) {
    document.body.innerHTML = '<div id="msg">This link is not valid. Ask for the current TV link.</div>';
  } else {
    // Max: the first TV link (no ?d=) follows the Harrod TV display 'frankfort' (or 'lexington' with ?loc=Lexington)
    // once it has been saved in the app; until then, and if GitHub cannot be read, it is the old fixed rotation.
    var isDefault = !display;
    if (isDefault) display = /[?&]loc=lexington/i.test(location.search) ? 'lexington' : 'frankfort';
    dashboard();
  }
  setTimeout(function () { location.reload(); }, RELOAD_HOURS * 3600 * 1000);

  function makeCount() {
    var c = document.createElement('div');
    c.id = 'count';
    document.body.appendChild(c);
    return c;
  }
  function showCount(c, left) {
    c.textContent = left;
    c.className = left <= 5 ? 'soon' : '';
  }
  // Max: a countdown top right so people know when the page is about to switch. It sits over each page's own top bar,
  // so that bar gets room on its right, or the countdown would cover "updated" and Fleet Live View's Refresh.
  function makeRoom(f) {
    f.addEventListener('load', function () {
      try {
        var d = f.contentDocument, bar = d.getElementById('top') || d.getElementById('top-bar');
        if (bar) bar.style.paddingRight = '90px';
      } catch (e) {}
    });
  }

  // ---------------------------------------------------------------------------------------------------------------
  // The first TV link (no ?d=): map, Fleet Live View, Bay View, 45 seconds each. Kept exactly as it was so a Pi already
  // pointed at .../tv#key=... keeps working. Frankfort is .../tv#key=..., Lexington is .../tv?loc=Lexington#key=...
  function legacy() {
    var SECONDS = 45;
    var shop = /[?&]loc=lexington/i.test(location.search) ? 'Lexington' : 'Frankfort';
    var SCREENS = ['map?loc=' + shop + '#key=' + key, 'fleet?location=' + shop + '&auto=1', 'bays?loc=' + shop + '#key=' + key];
    var frames = SCREENS.map(function (src) {
      var f = document.createElement('iframe');
      f.src = src;
      document.body.appendChild(f);
      makeRoom(f);
      return f;
    });
    var count = makeCount(), at = 0, left = SECONDS;
    frames[0].className = 'on';
    showCount(count, left);
    setInterval(function () {
      left--;
      if (left <= 0) {
        frames[at].className = '';
        at = (at + 1) % frames.length;
        frames[at].className = 'on';
        left = SECONDS;
      }
      showCount(count, left);
    }, 1000);
  }

  // ---------------------------------------------------------------------------------------------------------------
  // Harrod TV dashboard display (.../tv?d=<display id>#key=...). The slide list is set up in the app (Harrod TV, master
  // admin) and saved HERE on GitHub as tv/<id>.json, so reading it costs the app nothing. Each TV re-reads it every few
  // minutes, so an edit shows up by itself.
  //
  // Max: hidden slides must not keep asking the app for data. So only the slide on screen is loaded, plus the next one
  // a few seconds early so the switch is instant; every other slide is thrown away. The map / Bay View pull while they
  // are on screen and stop when they go off.
  function dashboard() {
    var LIST_EVERY_MS = 3 * 60 * 1000, PRELOAD_S = 8;
    var fellBack = false, cfg = null, list = [], at = -1, left = 0, cur = null, next = null, nextFor = null;
    var count = makeCount();
    var idle = document.createElement('div');
    idle.id = 'idle';
    idle.innerHTML = '<div class="clock"></div><div class="nm"></div>';
    document.body.appendChild(idle);

    try { cfg = JSON.parse(localStorage.getItem('tv-' + display) || 'null'); } catch (e) {}
    pullList();
    setInterval(pullList, LIST_EVERY_MS);
    setInterval(tick, 1000);
    if (cfg) start();

    function pullList() {
      fetch('tv/' + display + '.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (c) {
          if (fellBack) { location.reload(); return; }
          var first = !cfg, changed = !cfg || c.updated !== cfg.updated;
          cfg = c;
          try { localStorage.setItem('tv-' + display, JSON.stringify(c)); } catch (e) {}
          if (first) start();
          else if (changed) { dropAll(); start(); }   // an edit: start over with the new list
        })
        .catch(function () {
          if (cfg || fellBack) return;
          if (isDefault) {
            // the old link before its display is saved: run the old rotation, and start over once the display appears
            fellBack = true;
            count.parentNode.removeChild(count); idle.parentNode.removeChild(idle);
            legacy();
            setInterval(function () {
              fetch('tv/' + display + '.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {});
            }, LIST_EVERY_MS);
            return;
          }
          document.body.innerHTML = '<div id="msg">This display was not found. Check the link in Harrod TV in the app.</div>';
        });
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    // Max: the TVs stop asking the app after hours. Quiet from..to may cross midnight (19:00 -> 05:00).
    function quietNow() {
      var q = cfg && cfg.quiet;
      if (!q || !q.from || !q.to || q.from === q.to) return false;
      var t = nowHM();
      return q.from < q.to ? (t >= q.from && t < q.to) : (t >= q.from || t < q.to);
    }
    function usesApp(s) { return s.type === 'map' || s.type === 'fleet' || s.type === 'bays'; }
    function live() {
      var d = today(), quiet = quietNow();
      return (cfg.slides || []).filter(function (s) {
        if (s.show === false) return false;
        if (s.from && d < s.from) return false;
        if (s.to && d > s.to) return false;
        if (quiet && usesApp(s)) return false;
        return true;
      });
    }
    function secs(s) { return Math.max(5, Math.min(3600, parseInt(s.seconds, 10) || 45)); }

    function start() {
      list = live();
      at = -1;
      advance();
    }
    function advance() {
      var fresh = live(), was = cur && cur.slide;
      // the list can change with the clock (a date window opens, quiet hours start); keep our place by slide id
      if (JSON.stringify(fresh.map(function (s) { return s.id; })) !== JSON.stringify(list.map(function (s) { return s.id; }))) {
        var i = was ? fresh.map(function (s) { return s.id; }).indexOf(was.id) : -1;
        list = fresh;
        at = i;
      }
      if (!list.length) { dropAll(); showIdle(true); return; }
      showIdle(false);
      at = (at + 1) % list.length;
      var s = list[at];
      if (cur && cur.slide.id === s.id && list.length === 1) { left = secs(s); return; }   // one slide: just stay on it
      var layer = (next && nextFor === s.id) ? next : build(s);
      next = null; nextFor = null;
      layer.classList.add('on');
      if (cur && cur !== layer) remove(cur);
      cur = layer;
      left = secs(s);
      showCount(count, left);
      count.style.display = list.length > 1 && cfg.countdown !== false ? '' : 'none';
    }
    function tick() {
      if (!cfg) return;
      if (!list.length || !cur) {
        if (idle.style.display === 'flex') {
          idle.querySelector('.clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          if (live().length) start();
        }
        return;
      }
      left--;
      if (left === PRELOAD_S && list.length > 1) {
        var n = list[(at + 1) % list.length];
        if (n.id !== cur.slide.id) { if (next) remove(next); next = build(n); nextFor = n.id; }
      }
      if (left <= 0) advance();
      else showCount(count, left);
    }
    function showIdle(on) {
      idle.style.display = on ? 'flex' : 'none';
      count.style.display = 'none';
      if (on) {
        idle.querySelector('.nm').textContent = cfg.name || '';
        idle.querySelector('.clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }
    }
    function remove(l) { try { Array.prototype.forEach.call(l.querySelectorAll('iframe'), function (f) { f.src = 'about:blank'; }); } catch (e) {} if (l.parentNode) l.parentNode.removeChild(l); }
    function dropAll() { if (cur) remove(cur); if (next) remove(next); cur = null; next = null; nextFor = null; }

    function srcOf(s) {
      var shop = s.shop === 'Lexington' ? 'Lexington' : 'Frankfort';
      if (s.type === 'map') return 'map?loc=' + shop + '#key=' + key;
      if (s.type === 'fleet') return 'fleet?location=' + shop + '&auto=1';
      if (s.type === 'bays') return 'bays?loc=' + shop + '#key=' + key;
      if (s.type === 'windy') {
        // same address as the app's _htvWindySrc
        var lat = parseFloat(s.lat) || 38.2009, lon = parseFloat(s.lon) || -84.8733, ov = s.layer || 'radar';
        return 'https://embed.windy.com/embed2.html?lat=' + lat + '&lon=' + lon + '&detailLat=' + lat + '&detailLon=' + lon + '&zoom=' + (parseInt(s.wzoom, 10) || 8) +
               '&level=surface&overlay=' + encodeURIComponent(ov) + '&product=' + (ov === 'radar' ? 'radar' : 'ecmwf') + '&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=mph&metricTemp=%C2%B0F&radarRange=-1';
      }
      return s.url || 'about:blank';
    }
    function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function hex6(c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c.slice(1) : ''; }
    function widgetSrc(e) {
      var c = hex6(e.color) || 'ffffff', p = hex6(e.panel);
      if (e.kind === 'clock') return 'clock?tz=' + encodeURIComponent(e.tz || '') + '&h12=' + (e.h12 !== false ? 1 : 0) + '&sec=' + (e.sec !== false ? 1 : 0) + '&date=' + (e.date !== false ? 1 : 0) + '&color=' + c + '&panel=' + p;
      return 'weather?lat=' + parseFloat(e.lat) + '&lon=' + parseFloat(e.lon) + '&name=' + encodeURIComponent(e.name || '') + '&days=' + (parseInt(e.days, 10) || 6) + '&unit=' + (e.unit === 'C' ? 'C' : 'F') + '&color=' + c + '&panel=' + p;
    }
    function num(v) { v = parseFloat(v); return isNaN(v) ? 0 : Math.max(0, Math.min(100, v)); }
    function safeColor(c, dflt) { return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : dflt; }

    // One slide on screen. fit: 'full' = whole screen, 'fit' = whole picture shown (bars at the sides if needed),
    // 'box' = a smaller centered box, box% of the screen.
    function build(s) {
      var l = document.createElement('div');
      l.className = 'layer';
      l.slide = s;
      l.style.background = safeColor(s.bg, '#0e1a2e');
      var fit = s.fit || 'full', holder = l;
      if (fit === 'box') {
        var pct = Math.max(30, Math.min(100, parseInt(s.box, 10) || 80));
        holder = document.createElement('div');
        holder.className = 'box';
        holder.style.width = pct + '%';
        holder.style.height = pct + '%';
        l.appendChild(holder);
      }
      if (s.type === 'layout') {
        // a background picture plus items placed anywhere (x / y / w / h in % of the screen), later items on top.
        // After hours the truck map / Fleet Live View / Bay View items are left out (quiet hours).
        if (s.bgImg) {
          var bi = document.createElement('img');
          bi.className = 'pic'; bi.src = s.bgImg; bi.alt = '';
          bi.style.objectFit = s.bgFit === 'contain' ? 'contain' : 'cover';
          l.appendChild(bi);
        }
        var quiet = quietNow();
        (s.els || []).forEach(function (e) {
          if (quiet && usesApp({ type: e.kind })) return;
          var b = document.createElement('div');
          b.style.cssText = 'position:absolute;overflow:hidden;left:' + num(e.x) + '%;top:' + num(e.y) + '%;width:' + num(e.w) + '%;height:' + num(e.h) + '%;';
          if (e.kind === 'image') {
            if (!e.img) return;
            var pi = document.createElement('img');
            pi.className = 'pic'; pi.src = e.img; pi.alt = '';
            pi.style.objectFit = e.fit === 'cover' ? 'cover' : 'contain';
            b.appendChild(pi);
          } else if (e.kind === 'text') {
            var al = e.align === 'left' || e.align === 'right' ? e.align : 'center';
            b.style.display = 'flex'; b.style.alignItems = 'center';
            b.style.justifyContent = al === 'left' ? 'flex-start' : al === 'right' ? 'flex-end' : 'center';
            b.style.textAlign = al; b.style.fontWeight = '800'; b.style.lineHeight = '1.15';
            b.style.whiteSpace = 'pre-wrap'; b.style.wordWrap = 'break-word';
            b.style.fontSize = Math.max(2, Math.min(30, parseFloat(e.size) || 7)) + 'vh';
            b.style.color = safeColor(e.color, '#ffffff');
            var ebc = safeColor(e.bandColor, '#000000');
            if (e.band) b.innerHTML = '<span style="display:inline-block;padding:0.15em 0.4em;border-radius:0.25em;background:' + (ebc.length === 7 ? ebc + 'cc' : ebc) + '">' + esc(e.t) + '</span>';
            else { b.textContent = e.t || ''; b.style.textShadow = '0 0.04em 0.12em rgba(0,0,0,0.85)'; }
          } else if (e.kind === 'clock' || e.kind === 'weather') {
            // our own clock.html / weather.html, see-through so the background shows behind them
            var wf = document.createElement('iframe');
            wf.setAttribute('allowtransparency', 'true');
            wf.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;visibility:inherit;';
            wf.src = widgetSrc(e);
            b.appendChild(wf);
          } else {
            var src = srcOf({ type: e.kind, shop: e.shop, url: e.url, lat: e.lat, lon: e.lon, wzoom: e.wzoom, layer: e.layer });
            if (src === 'about:blank') return;
            var z = Math.max(25, Math.min(100, parseInt(e.zoom, 10) || 100)) / 100;
            var fr = document.createElement('iframe');
            fr.setAttribute('allow', 'autoplay; fullscreen');
            fr.style.cssText = 'position:absolute;left:0;top:0;border:0;background:#fff;visibility:inherit;width:' + (100 / z) + '%;height:' + (100 / z) + '%;transform:scale(' + z + ');transform-origin:0 0;';
            fr.src = src;
            b.appendChild(fr);
          }
          l.appendChild(b);
        });
      } else if (s.type === 'image' && s.img) {
        var im = document.createElement('img');
        im.className = 'pic';
        im.src = s.img;
        im.alt = '';
        im.style.objectFit = fit === 'full' ? 'cover' : 'contain';
        holder.appendChild(im);
      } else if (s.type !== 'image' && s.type !== 'text') {
        var f = document.createElement('iframe');
        f.style.inset = '0'; f.style.width = '100%'; f.style.height = '100%';
        f.setAttribute('allow', 'autoplay; fullscreen');
        if (usesApp(s)) makeRoom(f);
        f.src = srcOf(s);
        holder.appendChild(f);
      }
      (s.texts || []).forEach(function (t) {
        if (!t || !String(t.t || '').trim()) return;
        var d = document.createElement('div');
        d.className = 'txt';
        var size = Math.max(2, Math.min(30, parseFloat(t.size) || 8));
        d.style.fontSize = size + 'vh';
        d.style.textAlign = t.align === 'left' || t.align === 'right' ? t.align : 'center';
        d.style.color = safeColor(t.color, '#ffffff');
        if (t.pos === 'top') d.style.top = '6vh';
        else if (t.pos === 'bottom') d.style.bottom = '6vh';
        else { d.style.top = '50%'; d.style.transform = 'translateY(-50%)'; }
        var bc = safeColor(t.bandColor, '#000000');
        if (t.band) d.innerHTML = '<span style="background:' + (bc.length === 7 ? bc + 'cc' : bc) + '">' + esc(t.t) + '</span>';
        else { d.textContent = t.t; d.style.textShadow = '0 0.04em 0.12em rgba(0,0,0,0.85)'; }
        l.appendChild(d);
      });
      document.body.appendChild(l);
      return l;
    }
  }
  </script>
</body>
</html>
