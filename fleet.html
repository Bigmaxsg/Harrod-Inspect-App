<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harrod Fleet Live View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0e1a2e; color: #f0f4f8; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    #main-content { flex: 1; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; overflow: hidden; }
    #panes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #top-bar { background: linear-gradient(135deg, #1c2e4a 0%, #0e1a2e 100%); border-bottom: 2px solid #2a4a7f; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
    #top-bar-left { display: flex; align-items: center; gap: 10px; }
    #top-bar h1 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    #top-bar h1 span { color: #4fc3f7; }
    #fleet-icon { height: 72px; width: auto; flex-shrink: 0; mix-blend-mode: screen; }
    #harrod-logo { height: 32px; width: auto; flex-shrink: 0; filter: brightness(0) invert(1); }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.1); color: #cdd5e0; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 7px; padding: 5px 12px; font-size: 0.8rem; transition: background 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #top-bar-right { display: flex; align-items: center; gap: 12px; }
    #refresh-info { font-size: 0.75rem; color: #8fa8c8; text-align: right; }
    #last-updated { display: block; }
    #next-refresh { display: block; color: #6b90b8; font-size: 0.68rem; }
    #refresh-btn { background: #1565c0; color: #fff; border: none; border-radius: 7px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    #refresh-btn:hover { background: #1976d2; }
    #refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #tab-bar { display: flex; background: #111d2e; border-bottom: 2px solid #1e3052; padding: 0 16px; }
    .tab-btn { padding: 10px 22px; font-size: 0.88rem; font-weight: 600; color: #6b90b8; background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: #9ac3e8; }
    .tab-btn.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
    .tab-count { display: inline-block; background: rgba(79,195,247,0.15); color: #4fc3f7; border-radius: 10px; padding: 1px 7px; font-size: 0.72rem; margin-left: 5px; }
    #loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 14px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(79,195,247,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-txt { color: #8fa8c8; font-size: 0.88rem; }
    #error-msg { display: none; background: #3e1010; border: 1px solid #c62828; color: #ef9a9a; border-radius: 10px; padding: 14px 20px; margin: 20px; font-size: 0.88rem; }
    .location-pane { display: none; }
    .location-pane.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .pane-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .type-filter-bar { flex-shrink: 0; display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
    .filter-label { font-size: 0.73rem; font-weight: 600; color: #6b90b8; margin-right: 2px; white-space: nowrap; }
    .type-btn { padding: 4px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.07); color: #9ac3e8; cursor: pointer; transition: all 0.15s; }
    .type-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }
    .type-btn.active { background: #1565c0; border-color: #1976d2; color: #fff; }
    .summary-bar { flex-shrink: 0; display: flex; gap: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 14px; margin-bottom: 8px; flex-wrap: wrap; }
    .summary-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; }
    .summary-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sections-wrap { flex: 1; min-height: 0; display: grid; gap: 10px; align-items: stretch; width: 100%; overflow-x: hidden; }
    .sections-wrap.layout-idle { grid-template-columns: 2fr 7fr 2fr; }
    .section-block { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .section-header { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; }
    .section-header.green  { background: #1b3d1e; color: #a5d6a7; border-bottom: 2px solid #2e7d32; }
    .section-header.yellow { background: #3d3000; color: #fff176; border-bottom: 2px solid #f9a825; }
    .section-header.red    { background: #3e1010; color: #ef9a9a; border-bottom: 2px solid #c62828; }
    .col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .col-dot.green  { background: #66bb6a; box-shadow: 0 0 5px #66bb6a; }
    .col-dot.yellow { background: #ffee58; box-shadow: 0 0 5px #ffee58; }
    .col-dot.red    { background: #ef5350; box-shadow: 0 0 5px #ef5350; }
    .col-count { margin-left: auto; font-size: 0.72rem; opacity: 0.7; }
    .card-grid { flex: 1; min-height: 0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-top: none; border-radius: 0 0 8px 8px; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, 158px); gap: 7px; align-content: start; overflow: hidden; }
    .col-empty { text-align: center; padding: 18px 8px; color: #4a6080; font-size: 0.78rem; font-style: italic; grid-column: 1 / -1; }
    .truck-card { background: #fff; border-radius: 8px; padding: 9px 10px 8px; color: #1a2535; box-shadow: 0 1px 6px rgba(0,0,0,0.2); border-left: 3px solid #ccc; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; width: 158px; }
    .truck-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.32); }
    .truck-card.inuse  { border-left-color: #43a047; }
    .truck-card.idle   { border-left-color: #f9a825; }
    .truck-card.redtag { border-left-color: #ef5350; }
   .card-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
}

.card-num-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 0;
  flex: 1;
  z-index: 2;
}

.card-front-thumb {
  width: 42px !important;
  height: 42px !important;
  min-width: 42px !important;
  max-width: 42px !important;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #d5dde8;
  background: #eef3f8;
  flex: 0 0 42px;
}

.card-front-thumb img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
  object-position: center center;
  display: block;
}
    .card-num { font-size: 1.12rem; font-weight: 900; color: #0d2a5e; line-height: 1; }
    .card-type-chip { font-size: 0.59rem; font-weight: 700; padding: 2px 5px; border-radius: 7px; background: #e8edf8; color: #3a5a8c; flex-shrink: 0; white-space: nowrap; }
    .card-make { font-size: 0.67rem; color: #5a6e8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-status { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 12px; font-size: 0.63rem; font-weight: 700; width: fit-content; }
    .card-status .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .s-green  { background: #e8f5e9; color: #2e7d32; } .s-green .dot  { background: #43a047; }
    .s-yellow { background: #fff8e1; color: #e65100; } .s-yellow .dot { background: #f9a825; }
    .s-red    { background: #ffebee; color: #c62828; } .s-red .dot    { background: #ef5350; }
    .card-driver-row { display: flex; align-items: center; gap: 6px; border-radius: 5px; padding: 4px 6px; margin: 0 -2px; }
    .card-driver-row.assigned { background: #e3f2fd; }
    .card-driver-row.temp     { background: #fff3e0; border: 1px solid #ffcc80; }
    .driver-mini-avatar { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: #fff; }
    .driver-mini-avatar.assigned-av { background: #1565c0; }
    .driver-mini-avatar.temp-av     { background: #e65100; }
    .driver-mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .driver-name-col { flex: 1; min-width: 0; }
    .driver-name-text { font-size: 0.72rem; font-weight: 700; color: #1a2535; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .driver-label-text { font-size: 0.58rem; color: #7a8fa8; line-height: 1.2; }
    .temp-flag { font-size: 0.56rem; font-weight: 700; color: #e65100; display: block; }
    .card-defect-ok   { font-size: 0.62rem; color: #2e7d32; font-weight: 600; }
    .card-defect-warn { font-size: 0.62rem; color: #e65100; font-weight: 600; }
    .card-redtag-reason { font-size: 0.62rem; color: #c62828; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-last-trip { font-size: 0.59rem; color: #7a8fa8; }
    .card-pretrip-time { font-size: 0.59rem; color: #7a8fa8; }
    .card-elapsed { font-size: 0.62rem; color: #4fc3f7; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .click-hint { font-size: 0.57rem; color: #aab8cc; text-align: right; margin-top: 1px; }
    .card-admin-update { background: rgba(245,124,0,0.12); border: 1px solid rgba(245,124,0,0.3); border-radius: 5px; padding: 4px 6px; margin-top: 3px; }
    .card-admin-update-header { font-size: 0.58rem; font-weight: 700; color: #fb8c00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-admin-update-comment { font-size: 0.62rem; color: #ffcc80; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .card-admin-update-more { font-size: 0.55rem; color: #f57c00; margin-top: 2px; }

    /* compact mode — only truck # + type chip, no thumbnail */
    .card-compact { padding: 5px 8px; }
    .card-compact > *:not(.card-top-row) { display: none; }
    .card-compact .card-front-thumb { display: none; }
    #drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; }
    #drawer-backdrop.open { display: block; }
    #drawer { position: fixed; top: 0; right: -440px; width: 420px; max-width: 96vw; height: 100vh; background: #0e1a2e; border-left: 2px solid #2a4a7f; z-index: 301; overflow-y: auto; transition: right 0.3s ease; box-shadow: -4px 0 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    #drawer.open { right: 0; }
    #drawer-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid #1e3052; background: #111d2e; flex-shrink: 0; }
    #drawer-title { font-size: 1.4rem; font-weight: 900; color: #4fc3f7; }
    #drawer-subtitle { font-size: 0.82rem; color: #8fa8c8; margin-top: 3px; }
    #drawer-close { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #cdd5e0; border-radius: 6px; padding: 6px 10px; font-size: 1rem; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
    #drawer-close:hover { background: rgba(255,255,255,0.18); }
    #drawer-body { padding: 18px 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .drawer-section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px; }
    .drawer-section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4fc3f7; margin-bottom: 10px; }
    .drawer-row { display: flex; gap: 10px; margin-bottom: 7px; font-size: 0.82rem; }
    .drawer-row:last-child { margin-bottom: 0; }
    .drawer-truck-photo-wrap {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
}

.drawer-truck-photo {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  object-position: center center;
  display: block;
}
    .drawer-lbl { color: #6b90b8; font-weight: 600; min-width: 90px; flex-shrink: 0; }
    .drawer-val { color: #e0e8f4; font-weight: 500; }
    .drawer-val.bold { font-weight: 800; color: #fff; }
    .drawer-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 16px; font-size: 0.78rem; font-weight: 700; }
    .drawer-status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .ds-green  { background: #1b3d1e; color: #a5d6a7; } .ds-green .dot  { background: #66bb6a; }
    .ds-yellow { background: #3d3000; color: #fff176; } .ds-yellow .dot { background: #ffee58; }
    .ds-red    { background: #3e1010; color: #ef9a9a; } .ds-red .dot    { background: #ef5350; }
    .drawer-driver-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 12px; }
    .drawer-driver-card.temp-card { background: rgba(230,81,0,0.12); border: 1px solid rgba(230,81,0,0.3); }
    .drawer-driver-card.assigned-card { background: rgba(21,101,192,0.12); border: 1px solid rgba(21,101,192,0.3); }
    .drawer-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff; }
    .drawer-avatar.assigned-av { background: #1565c0; }
    .drawer-avatar.temp-av     { background: #e65100; }
    .drawer-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .drawer-driver-info { flex: 1; min-width: 0; }
    .drawer-driver-name { font-size: 0.95rem; font-weight: 800; color: #fff; }
    .drawer-driver-meta { font-size: 0.72rem; color: #8fa8c8; margin-top: 2px; }
    .assign-pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; margin-top: 4px; }
    .assign-pill.assigned { background: #1565c0; color: #fff; }
    .assign-pill.temp     { background: #e65100; color: #fff; }
    .defect-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; color: #cdd5e0; }
    .defect-item:last-child { border-bottom: none; }
    .defect-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef5350; flex-shrink: 0; margin-top: 4px; }
    .defect-fixed-dot { background: #43a047; }
    .defect-none { color: #4a6080; font-style: italic; font-size: 0.8rem; }
    .correction-item { display: flex; align-items: flex-start; gap: 7px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.78rem; color: #cdd5e0; }
    .correction-item:last-child { border-bottom: none; }
    .correction-icon { font-size: 0.8rem; flex-shrink: 0; margin-top: 1px; }
    .defect-label-list { margin: 6px 0 0 4px; padding: 0; list-style: none; }
    .defect-label-list li { font-size: 0.77rem; color: #cdd5e0; padding: 2px 0; line-height: 1.4; }
    .defect-label-list li::before { content: "– "; color: #6b90b8; }
    .defect-driver-note { font-size: 0.73rem; color: #8fa8c8; font-style: italic; margin-top: 6px; padding-left: 2px; }
    .corrections-summary { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }
    .correction-summary-line { font-size: 0.75rem; color: #a5d6a7; padding: 2px 0; }
    .disposition-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; margin-top: 6px; }

    .disposition-tag.open { background: #3e1010; color: #ef9a9a; }

    .redtag-detail-reason { font-size: 0.88rem; color: #ef9a9a; font-weight: 600; margin-bottom: 8px; }
    .redtag-detail-meta { font-size: 0.75rem; color: #8fa8c8; }
  </style>
</head>
<body>
<div id="top-bar">
  <div id="top-bar-left">
    <img src="./Harrod%20app%20fleet%20view%20icon.png" id="fleet-icon" alt="Fleet">
    <img src="./Harrod_Concrete_BlueLogo_TransparentBkgrd.png" id="harrod-logo" alt="Harrod Concrete &amp; Stone">
    <h1><span>Fleet Live View</span></h1>
  </div>
  <div id="top-bar-right">
    <div id="refresh-info">
      <span id="last-updated">Loading...</span>
      <span id="next-refresh"></span>
    </div>
    <button id="refresh-btn" onclick="manualRefresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
</div>
<div id="tab-bar">
  <button class="tab-btn active" onclick="switchTab('Frankfort',this)">&#x1F4CD; Frankfort <span class="tab-count" id="tc-Frankfort">-</span></button>
  <button class="tab-btn" onclick="switchTab('Lexington',this)">&#x1F4CD; Lexington <span class="tab-count" id="tc-Lexington">-</span></button>
</div>
<div id="main-content">
  <div id="loading-overlay"><div class="spinner"></div><div class="loading-txt">Loading fleet data...</div></div>
  <div id="error-msg"></div>
  <div id="panes"></div>
</div>
<div id="drawer-backdrop" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="drawer-header">
    <div>
      <div id="drawer-title">Truck #-</div>
      <div id="drawer-subtitle"></div>
    </div>
    <button id="drawer-close" onclick="closeDrawer()">X</button>
  </div>
  <div id="drawer-body"></div>
</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXrdf-GgefxsQSI6cBwlXZtQj54Rgv9ySNjBQ9Gh73ZnjMlQWnUtiGW2fQ-OxwG4-J8Q/exec';
  var POLL_INTERVAL = 30 * 1000;
  var LOCATIONS   = ['Frankfort', 'Lexington'];
  var TRUCK_TYPES = ['Concrete Mixer', 'Dump Truck', 'Tractor'];
  var _allTrucks = [], _truckMap = {}, _activeTab = 'Frankfort';
  var _typeFilters = { 'Frankfort': '', 'Lexington': '' };
  var _pollTimer = null, _countdownTimer = null, _nextPollAt = null, _isLoading = false;
  var _lastKnownTimestamp = null, _clockTimer = null;
  var _params      = new URLSearchParams(window.location.search);
  var _lockedLoc   = (_params.get('location') || '').trim();
  var _lockedType  = (_params.get('type')     || '').trim();
  window.addEventListener('load', function() {
    if (_lockedLoc) {
      _activeTab = _lockedLoc;
      if (_lockedType) _typeFilters[_lockedLoc] = _lockedType;
      document.getElementById('tab-bar').style.display = 'none';
      var lockedTypes = _lockedType ? _lockedType.split(',').map(function(s){return s.trim();}) : [];
      var titleParts = [_lockedLoc];
      if (lockedTypes.length === 1) titleParts.push(lockedTypes[0] + 's');
      else if (lockedTypes.length > 1) titleParts.push(lockedTypes.map(function(s){return s+'s';}).join(' & '));
      document.querySelector('#top-bar h1 span').textContent = titleParts.join(' — ');
    }
    loadFleetData();
  });
  function loadFleetData() {
    if (_isLoading) return;
    _isLoading = true;
    document.getElementById('refresh-btn').classList.add('spinning');
    document.getElementById('last-updated').textContent = 'Refreshing...';
    fetch(GAS_URL + '?action=fleetData')
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data) {
        _isLoading = false;
        document.getElementById('refresh-btn').classList.remove('spinning');
        if (!data.success) throw new Error(data.message || 'Server error');
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
        if (data.lastModified) _lastKnownTimestamp = data.lastModified;
        renderAll(data.trucks || []);
        document.getElementById('last-updated').textContent = 'Updated ' + fmtTime(new Date());
        schedulePoll();
      })
      .catch(function(err) {
        _isLoading = false;
        document.getElementById('refresh-btn').classList.remove('spinning');
        document.getElementById('loading-overlay').style.display = 'none';
        var em = document.getElementById('error-msg');

  function fitGridToSection(gridEl) {
    var cards = Array.from(gridEl.querySelectorAll('.truck-card'));
    var N = cards.length;
    gridEl.style.gridTemplateColumns = '';
    gridEl.style.gridTemplateRows = '';
    gridEl.style.overflowY = '';
    cards.forEach(function(c) { c.style.width = ''; c.style.height = ''; c.style.overflow = ''; c.classList.remove('card-compact'); });
    if (!N) return;

    var GAP = 7, PAD = 8;
    var availW = gridEl.clientWidth  - PAD * 2;
    var availH = gridEl.clientHeight - PAD * 2;
    if (availW < 20 || availH < 20) return;

    var bestCols = 1, bestMin = 0;
    for (var c = 1; c <= N; c++) {
      var r = Math.ceil(N / c);
      var w = (availW - GAP * (c - 1)) / c;
      var h = (availH - GAP * (r - 1)) / r;
      if (w <= 0 || h <= 0) continue;
      var m = Math.min(w, h);
      if (m > bestMin) { bestMin = m; bestCols = c; }
    }

    var rows  = Math.ceil(N / bestCols);
    var cardW = Math.floor((availW - GAP * (bestCols - 1)) / bestCols);
    var cardH = Math.floor((availH - GAP * (rows    - 1)) / rows);
    var compact = cardH < 65;

    gridEl.style.gridTemplateColumns = 'repeat(' + bestCols + ', ' + cardW + 'px)';
    gridEl.style.gridTemplateRows    = 'repeat(' + rows    + ', ' + cardH + 'px)';
    gridEl.style.overflowY  = 'hidden';
    gridEl.style.alignContent = 'start';

    cards.forEach(function(card) {
      card.style.width    = cardW + 'px';
      card.style.height   = cardH + 'px';
      card.style.overflow = 'hidden';
      card.classList.toggle('card-compact', compact);
    });
  }

          defectBody+='<div style="margin-top:8px;padding:7px 9px;background:rgba(79,195,247,0.06);border-radius:6px;border-left:2px solid #4fc3f7">'
            +'<div style="font-size:0.67rem;font-weight:700;color:#4fc3f7;margin-bottom:3px;letter-spacing:0.04em">DRIVER NOTE</div>'
            +'<div style="font-size:0.78rem;color:#cdd5e0">'+esc(tripRec.defectsNotes)+'</div>'
            +'</div>';
        }
      } else {
        if (tripRec.postTripDone === false) {
          defectBody='<div style="background:rgba(230,81,0,0.12);border:1px solid rgba(230,81,0,0.4);border-radius:7px;padding:10px 12px;margin-bottom:8px;">'
            +'<div style="font-size:0.8rem;font-weight:700;color:#ff8a65;">⚠ Post-trip inspection not submitted</div>'
            +'<div style="font-size:0.73rem;color:#ffb59d;margin-top:3px;">Driver did not complete a post-trip DVIR for this shift.</div>'
            +'</div>';
        }
        if (!tripRec.hasDefects || tripRec.defectCount === 0) {
          defectBody+='<div class="defect-none">✅ No defects reported</div>';
        } else if (tripRec.postAllClear) {
          var ltN = tripRec.correctedDefectCount || tripRec.defectCount;
          var ltPlu = ltN !== 1 ? 's' : '';
          defectBody='<div class="defect-item"><div class="defect-dot defect-fixed-dot"></div><div style="color:#a5d6a7;font-weight:600">✅ '+esc(ltN+' defect'+ltPlu+' corrected end of shift')+'</div></div>';
          var cLabels = Array.isArray(tripRec.correctedDefectLabels) ? tripRec.correctedDefectLabels : [];
          if (cLabels.length > 0) {
            defectBody+='<ul class="defect-label-list">';
            cLabels.forEach(function(lbl) { defectBody+='<li>'+esc(lbl)+'</li>'; });
            defectBody+='</ul>';
          }
        } else if (tripRec.lastTripStatus === 'Complete') {
          var ltR = tripRec.remainingDefectCount || 0;
          var ltRPlu = ltR !== 1 ? 's' : '';
          defectBody='<div class="defect-item"><div class="defect-dot"></div><div style="font-weight:600;color:#ffee58">⚠ '+esc(ltR+' defect'+ltRPlu+' unresolved')+'</div></div>';
          var rLabels = Array.isArray(tripRec.remainingDefectLabels) ? tripRec.remainingDefectLabels : [];
          if (rLabels.length > 0) {
            defectBody+='<ul class="defect-label-list">';
            rLabels.forEach(function(lbl) { defectBody+='<li>'+esc(lbl)+'</li>'; });
            defectBody+='</ul>';
          }
          var ltCC = tripRec.correctedDefectCount || 0;
          if (ltCC > 0) {
            var ccLabels = Array.isArray(tripRec.correctedDefectLabels) ? tripRec.correctedDefectLabels : [];
            defectBody+='<div class="defect-driver-note">✓ '+esc(ltCC+' corrected: '+(ccLabels.length ? ccLabels.join(', ') : 'see details'))+'</div>';
          }
        } else {
          var ltDC = tripRec.defectCount || 0;
          var ltDPlu = ltDC !== 1 ? 's' : '';
          defectBody='<div class="defect-item"><div class="defect-dot"></div><div style="font-weight:600">'+esc(ltDC+' defect'+ltDPlu)+'</div></div>';
          var dLabels = Array.isArray(tripRec.defectLabels) ? tripRec.defectLabels : [];
          if (dLabels.length > 0) {
            defectBody+='<ul class="defect-label-list">';
            dLabels.forEach(function(lbl) { defectBody+='<li>'+esc(lbl)+'</li>'; });
            defectBody+='</ul>';
          }
          if (tripRec.defectsNotes) {
            defectBody+='<div class="defect-driver-note">'+esc(tripRec.defectsNotes)+'</div>';
          }
        }
      }
      body+='<div class="drawer-section"><div class="drawer-section-title">'+(t.status==='in_use'?'Current Pre-Trip':'Last Trip Inspection')+'</div>'+defectBody+'</div>';
    }
    if (t.redTag) {
      body+='<div class="drawer-section"><div class="drawer-section-title">Red Tag Details</div><div class="redtag-detail-box"><div class="redtag-detail-reason"> '+esc(t.redTag.reason||'No reason specified')+'</div><div class="redtag-detail-meta">Tagged by: <strong>'+esc(t.redTag.taggedBy)+'</strong>'+(t.redTag.taggedByRole?' ('+esc(t.redTag.taggedByRole)+')':'')+'</div>'+(t.redTag.taggedAt?'<div class="redtag-detail-meta" style="margin-top:4px">Tagged: '+esc(fmtDateTime(t.redTag.taggedAt))+'</div>':'')+'</div><div style="margin-top:10px;font-size:0.78rem;color:#ef9a9a;font-weight:600">Out of service until red tag is resolved.</div></div>';
    }
    if (t.notes) {
      body+='<div class="drawer-section"><div class="drawer-section-title">Truck Notes</div><div style="font-size:0.82rem;color:#cdd5e0">'+esc(t.notes)+'</div></div>';
    }
    document.getElementById('drawer-body').innerHTML = body;
    document.getElementById('drawer-backdrop').classList.add('open');
    document.getElementById('drawer').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    document.getElementById('drawer-backdrop').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e) { if (e.key==='Escape') closeDrawer(); });
  function esc(s) {
    return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function driveImgUrl(link) {
    if (!link) return null;
    var m = link.match(/\/d\/([a-zA-Z0-9_-]+)/) || link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : null;
  }
  function fmtElapsed(isoStr) {
    if (!isoStr) return null;
    var ms = Date.now() - new Date(isoStr).getTime();
    if (isNaN(ms) || ms < 0) return null;
    var h = Math.floor(ms / 3600000);
    var m = Math.floor((ms % 3600000) / 60000);
    return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
  }
  function updateElapsedTimes() {
    document.querySelectorAll('[data-pretrip-start]').forEach(function(el) {
      var e = fmtElapsed(el.getAttribute('data-pretrip-start'));
      if (e) el.textContent = '⏱ ' + e;
    });
  }
  function startClock() {
    if (_clockTimer) return;
    _clockTimer = setInterval(updateElapsedTimes, 30000);
  }
  function fmtTime(d) { var h=d.getHours(),m=d.getMinutes(),ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+(m<10?'0':'')+m+' '+ap; }
  function fmtDate(iso) { if(!iso)return''; var d=new Date(iso+'T00:00:00'); if(isNaN(d))return iso; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
  function fmtDateTime(ts) { if(!ts)return''; var d=new Date(ts); if(isNaN(d))return ts; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2)+' '+fmtTime(d); }
</script>
</body>
</html>
