<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harrod Fleet Live View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0e1a2e; color: #f0f4f8; min-height: 100vh; }
    #top-bar { background: linear-gradient(135deg, #1c2e4a 0%, #0e1a2e 100%); border-bottom: 2px solid #2a4a7f; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
    #top-bar-left { display: flex; align-items: center; gap: 12px; }
    #top-bar h1 { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
    #top-bar h1 span { color: #4fc3f7; }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.1); color: #cdd5e0; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 7px; padding: 5px 12px; font-size: 0.8rem; transition: background 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #top-bar-right { display: flex; align-items: center; gap: 12px; }
    #refresh-info { font-size: 0.75rem; color: #8fa8c8; text-align: right; }
    #last-updated { display: block; }
    #next-refresh { display: block; color: #6b90b8; font-size: 0.68rem; }
    #refresh-btn { background: #1565c0; color: #fff; border: none; border-radius: 7px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 5px; }
    #refresh-btn:hover { background: #1976d2; }
    #refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #tab-bar { display: flex; background: #111d2e; border-bottom: 2px solid #1e3052; padding: 0 16px; }
    .tab-btn { padding: 10px 22px; font-size: 0.88rem; font-weight: 600; color: #6b90b8; background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: #9ac3e8; }
    .tab-btn.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
    .tab-count { display: inline-block; background: rgba(79,195,247,0.15); color: #4fc3f7; border-radius: 10px; padding: 1px 7px; font-size: 0.72rem; margin-left: 5px; }
    #loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 14px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(79,195,247,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-txt { color: #8fa8c8; font-size: 0.88rem; }
    #error-msg { display: none; background: #3e1010; border: 1px solid #c62828; color: #ef9a9a; border-radius: 10px; padding: 14px 20px; margin: 20px; font-size: 0.88rem; }
    .location-pane { display: none; padding: 12px 16px; }
    .location-pane.active { display: block; }
    .type-filter-bar { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .type-filter-bar .filter-label { font-size: 0.73rem; font-weight: 600; color: #6b90b8; margin-right: 2px; white-space: nowrap; }
    .type-btn { padding: 4px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.07); color: #9ac3e8; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .type-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }
    .type-btn.active { background: #1565c0; border-color: #1976d2; color: #fff; box-shadow: 0 0 8px rgba(21,101,192,0.4); }
    .summary-bar { display: flex; gap: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 14px; margin-bottom: 10px; flex-wrap: wrap; }
    .summary-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; }
    .summary-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sections-wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: start; }
    @media (max-width: 900px) { .sections-wrap { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .sections-wrap { grid-template-columns: 1fr; } }
    .section-header { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; }
    .section-header.green  { background: #1b3d1e; color: #a5d6a7; border-bottom: 2px solid #2e7d32; }
    .section-header.yellow { background: #3d3000; color: #fff176; border-bottom: 2px solid #f9a825; }
    .section-header.red    { background: #3e1010; color: #ef9a9a; border-bottom: 2px solid #c62828; }
    .col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .col-dot.green  { background: #66bb6a; box-shadow: 0 0 5px #66bb6a; }
    .col-dot.yellow { background: #ffee58; box-shadow: 0 0 5px #ffee58; }
    .col-dot.red    { background: #ef5350; box-shadow: 0 0 5px #ef5350; }
    .col-count { margin-left: auto; font-size: 0.72rem; opacity: 0.7; }
    .card-grid { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-top: none; border-radius: 0 0 8px 8px; padding: 8px; min-height: 60px; display: flex; flex-wrap: wrap; gap: 7px; align-content: flex-start; }
    .col-empty { width: 100%; text-align: center; padding: 20px 8px; color: #4a6080; font-size: 0.78rem; font-style: italic; }
    .truck-card { background: #fff; border-radius: 8px; padding: 9px 10px; color: #1a2535; box-shadow: 0 1px 6px rgba(0,0,0,0.22); width: 160px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; transition: transform 0.12s, box-shadow 0.12s; border-left: 3px solid #ccc; }
    .truck-card:hover { transform: translateY(-2px); box-shadow: 0 3px 12px rgba(0,0,0,0.3); }
    .truck-card.inuse  { border-left-color: #43a047; }
    .truck-card.idle   { border-left-color: #f9a825; }
    .truck-card.redtag { border-left-color: #ef5350; }
    .card-num-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
    .card-num { font-size: 1.15rem; font-weight: 900; color: #0d2a5e; line-height: 1; }
    .card-type-chip { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 8px; white-space: nowrap; letter-spacing: 0.02em; background: #e8edf8; color: #3a5a8c; flex-shrink: 0; }
    .card-make { font-size: 0.68rem; color: #5a6e8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-status { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; width: fit-content; }
    .card-status .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .s-green  { background: #e8f5e9; color: #2e7d32; }
    .s-green .dot  { background: #43a047; }
    .s-yellow { background: #fff8e1; color: #e65100; }
    .s-yellow .dot { background: #f9a825; }
    .s-red    { background: #ffebee; color: #c62828; }
    .s-red .dot    { background: #ef5350; }
    .card-driver-line { font-size: 0.67rem; color: #3a5270; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-driver-line strong { color: #1a3a5e; }
    .card-defect-ok   { font-size: 0.63rem; color: #2e7d32; font-weight: 600; }
    .card-defect-warn { font-size: 0.63rem; color: #e65100; font-weight: 600; }
    .card-redtag-reason { font-size: 0.63rem; color: #c62828; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-last-trip { font-size: 0.6rem; color: #7a8fa8; }
    .card-assign { font-size: 0.58rem; font-weight: 700; padding: 1px 5px; border-radius: 6px; display: inline-block; }
    .assign-assigned { background: #e3f2fd; color: #1565c0; }
    .assign-temp     { background: #fff8e1; color: #e65100; }
  </style>
</head>
<body>
<div id="top-bar">
  <div id="top-bar-left">
    <a href="./index.html" class="back-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> Back to App</a>
    <h1>&#x1F69B; Harrod <span>Fleet Live View</span></h1>
  </div>
  <div id="top-bar-right">
    <div id="refresh-info"><span id="last-updated">Loading…</span><span id="next-refresh"></span></div>
    <button id="refresh-btn" onclick="manualRefresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
</div>
<div id="tab-bar">
  <button class="tab-btn active" onclick="switchTab('Frankfort', this)">&#x1F4CD; Frankfort <span class="tab-count" id="tc-Frankfort">–</span></button>
  <button class="tab-btn" onclick="switchTab('Lexington', this)">&#x1F4CD; Lexington <span class="tab-count" id="tc-Lexington">–</span></button>
</div>
<div id="main-content" style="padding:12px 16px;">
  <div id="loading-overlay"><div class="spinner"></div><div class="loading-txt">Loading fleet data…</div></div>
  <div id="error-msg"></div>
  <div id="panes"></div>
</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXrdf-GgefxsQSI6cBwlXZtQj54Rgv9ySNjBQ9Gh73ZnjMlQWnUtiGW2fQ-OxwG4-J8Q/exec';
  var REFRESH_INTERVAL = 2 * 60 * 1000;
  var LOCATIONS   = ['Frankfort', 'Lexington'];
  var TRUCK_TYPES = ['All', 'Concrete Mixer', 'Dump Truck', 'Tractor'];
  var _allTrucks = [], _activeTab = 'Frankfort';
  var _typeFilters = { 'Frankfort': 'All', 'Lexington': 'All' };
  var _refreshTimer = null, _countdownTimer = null, _nextRefreshAt = null, _isLoading = false;

  window.addEventListener('load', function() { loadFleetData(); });

  function loadFleetData() {
    if (_isLoading) return;
    _isLoading = true;
    document.getElementById('refresh-btn').classList.add('spinning');
    document.getElementById('last-updated').textContent = 'Refreshing…';
    fetch(GAS_URL + '?action=fleetData')
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data) {
        _isLoading = false;
        document.getElementById('refresh-btn').classList.remove('spinning');
        if (!data.success) throw new Error(data.message || 'Server error');
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
        renderAll(data.trucks || []);
        document.getElementById('last-updated').textContent = 'Updated ' + fmtTime(new Date());
        scheduleNextRefresh();
      })
      .catch(function(err) {
        _isLoading = false;
        document.getElementById('refresh-btn').classList.remove('spinning');
        document.getElementById('loading-overlay').style.display = 'none';
        var em = document.getElementById('error-msg');
        em.style.display = 'block';
        em.textContent = '⚠ Could not load fleet data: ' + err.message;
        scheduleNextRefresh();
      });
  }

  function manualRefresh() {
    clearTimeout(_refreshTimer); clearInterval(_countdownTimer);
    document.getElementById('next-refresh').textContent = '';
    loadFleetData();
  }

  function scheduleNextRefresh() {
    clearTimeout(_refreshTimer); clearInterval(_countdownTimer);
    _nextRefreshAt = Date.now() + REFRESH_INTERVAL;
    _refreshTimer = setTimeout(function() { loadFleetData(); }, REFRESH_INTERVAL);
    _countdownTimer = setInterval(function() {
      var s = Math.max(0, Math.round((_nextRefreshAt - Date.now()) / 1000));
      var m = Math.floor(s / 60); s = s % 60;
      document.getElementById('next-refresh').textContent = 'Next refresh in ' + m + ':' + (s < 10 ? '0' : '') + s;
      if (m <= 0 && s <= 0) clearInterval(_countdownTimer);
    }, 1000);
  }

  function switchTab(location, btn) {
    _activeTab = location;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.location-pane').forEach(function(p) { p.classList.remove('active'); });
    var pane = document.getElementById('pane-' + safeCssId(location));
    if (pane) pane.classList.add('active');
  }

  function safeCssId(s) { return s.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, ''); }

  function sortTrucks(arr) {
    return arr.slice().sort(function(a, b) {
      var na = parseFloat(a.truckNumber), nb = parseFloat(b.truckNumber);
      if (!isNaN(na) && !isNaN(nb)) return nb - na;
      return (b.truckNumber || '').localeCompare(a.truckNumber || '');
    });
  }

  function setTypeFilter(loc, type) {
    _typeFilters[loc] = type;
    renderPane(loc);
    var pane = document.getElementById('pane-' + safeCssId(loc));
    if (pane) pane.querySelectorAll('.type-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.type === type);
    });
  }

  function renderAll(trucks) {
    _allTrucks = trucks;
    var byLoc = {};
    LOCATIONS.forEach(function(loc) { byLoc[loc] = []; });
    trucks.forEach(function(t) { if (byLoc[t.location] !== undefined) byLoc[t.location].push(t); });
    LOCATIONS.forEach(function(loc) { var el = document.getElementById('tc-' + loc); if (el) el.textContent = byLoc[loc].length; });
    var panesEl = document.getElementById('panes');
    panesEl.innerHTML = '';
    LOCATIONS.forEach(function(loc) {
      var pane = document.createElement('div');
      pane.className = 'location-pane' + (loc === _activeTab ? ' active' : '');
      pane.id = 'pane-' + safeCssId(loc);
      var fb = '<div class="type-filter-bar"><span class="filter-label">Filter by type:</span>';
      TRUCK_TYPES.forEach(function(type) {
        var a = (_typeFilters[loc] || 'All') === type;
        fb += '<button class="type-btn' + (a ? ' active' : '') + '" data-type="' + esc(type) + '" onclick="setTypeFilter(\'' + esc(loc) + '\',\'' + esc(type) + '\')">' + esc(type) + '</button>';
      });
      fb += '</div>';
      pane.innerHTML = fb + '<div class="summary-placeholder"></div><div class="sections-placeholder"></div>';
      panesEl.appendChild(pane);
      renderPane(loc);
    });
  }

  function renderPane(loc) {
    var pane = document.getElementById('pane-' + safeCssId(loc));
    if (!pane) return;
    var af = _typeFilters[loc] || 'All';
    var lt = _allTrucks.filter(function(t) { return t.location === loc; });
    var filtered = af === 'All' ? lt : lt.filter(function(t) { return (t.type||'').trim().toLowerCase() === af.toLowerCase(); });
    var inUse  = sortTrucks(filtered.filter(function(t) { return t.status === 'in_use'; }));
    var idle   = sortTrucks(filtered.filter(function(t) { return t.status === 'not_in_use'; }));
    var redtag = sortTrucks(filtered.filter(function(t) { return t.status === 'red_tagged'; }));
    var fl = af === 'All' ? '' : ' — ' + af + 's';
    var sum = '<div class="summary-bar">' + si('#66bb6a', inUse.length + ' In Use') + si('#ffee58', idle.length + ' Not In Use') + si('#ef5350', redtag.length + ' Red Tagged') + si('#4fc3f7', filtered.length + ' Total' + fl) + '</div>';
    var secs = '<div class="sections-wrap">' + bsec('green','IN USE TODAY',inUse,buildInUseCard) + bsec('yellow','NOT IN USE',idle,buildIdleCard) + bsec('red','RED TAGGED',redtag,buildRedTagCard) + '</div>';
    var sp = pane.querySelector('.summary-placeholder');
    var secp = pane.querySelector('.sections-placeholder');
    if (sp) sp.outerHTML = sum; else { var sb = pane.querySelector('.summary-bar'); if (sb) sb.outerHTML = sum; }
    var newSecp = pane.querySelector('.sections-placeholder');
    if (newSecp) newSecp.outerHTML = secs; else { var sw = pane.querySelector('.sections-wrap'); if (sw) sw.outerHTML = secs; }
  }

  function si(color, label) { return '<div class="summary-item"><div class="summary-dot" style="background:' + color + ';box-shadow:0 0 4px ' + color + '"></div><span>' + esc(label) + '</span></div>'; }

  function bsec(color, title, trucks, fn) {
    var h = '<div class="section-header ' + color + '"><div class="col-dot ' + color + '"></div>' + esc(title) + '<span class="col-count">' + trucks.length + '</span></div>';
    var b = trucks.length === 0 ? '<div class="col-empty">None right now</div>' : trucks.map(fn).join('');
    return '<div><div>' + h + '</div><div class="card-grid">' + b + '</div></div>';
  }

  function typeChip(type) {
    var s = (type||'').replace('Concrete Mixer','Mixer').replace('Dump Truck','Dump');
    return '<span class="card-type-chip">' + esc(s) + '</span>';
  }

  function buildInUseCard(t) {
    var ab = typeof t.driverAssigned === 'boolean' ? ' <span class="card-assign ' + (t.driverAssigned ? 'assign-assigned' : 'assign-temp') + '">' + (t.driverAssigned ? 'Assigned' : 'Temp') + '</span>' : '';
    var def = t.preTrip ? (t.preTrip.hasDefects ? '<div class="card-defect-warn">⚠ ' + t.preTrip.defectCount + ' defect(s)</div>' : '<div class="card-defect-ok">✓ No defects</div>') : '';
    return '<div class="truck-card inuse">'
      + '<div class="card-num-row"><span class="card-num">#' + esc(t.truckNumber) + '</span>' + typeChip(t.type) + '</div>'
      + '<div class="card-make">' + esc(t.year + ' ' + t.make) + '</div>'
      + '<div class="card-status s-green"><div class="dot"></div>In Use Today</div>'
      + (t.currentDriver ? '<div class="card-driver-line"><strong>' + esc(t.currentDriver) + '</strong>' + ab + '</div>' : '')
      + def + '</div>';
  }

  function buildIdleCard(t) {
    var def = t.lastTrip ? (t.lastTrip.hasDefects ? '<div class="card-defect-warn">⚠ ' + t.lastTrip.defectCount + ' defect(s) last trip</div>' : '<div class="card-defect-ok">✓ No defects</div>') : '<div class="card-defect-ok">✓ No history yet</div>';
    var lt = t.lastTripDate ? '<div class="card-last-trip">Last: ' + esc(fmtDate(t.lastTripDate)) + '</div>' : '';
    var ld = t.lastDriver ? '<div class="card-driver-line">' + esc(t.lastDriver) + '</div>' : '';
    return '<div class="truck-card idle">'
      + '<div class="card-num-row"><span class="card-num">#' + esc(t.truckNumber) + '</span>' + typeChip(t.type) + '</div>'
      + '<div class="card-make">' + esc(t.year + ' ' + t.make) + '</div>'
      + '<div class="card-status s-yellow"><div class="dot"></div>Not In Use</div>'
      + ld + def + lt + '</div>';
  }

  function buildRedTagCard(t) {
    var r = t.redTag ? '<div class="card-redtag-reason">🔴 ' + esc(t.redTag.reason||'No reason given') + '</div>' : '';
    var by = t.redTag ? '<div class="card-driver-line">By: <strong>' + esc(t.redTag.taggedBy) + '</strong></div>' : '';
    return '<div class="truck-card redtag">'
      + '<div class="card-num-row"><span class="card-num">#' + esc(t.truckNumber) + '</span>' + typeChip(t.type) + '</div>'
      + '<div class="card-make">' + esc(t.year + ' ' + t.make) + '</div>'
      + '<div class="card-status s-red"><div class="dot"></div>Red Tagged</div>'
      + r + by + '</div>';
  }

  function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function fmtTime(d) { var h=d.getHours(),m=d.getMinutes(),ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+(m<10?'0':'')+m+' '+ap; }
  function fmtDate(iso) { if(!iso)return''; var d=new Date(iso+'T00:00:00'); if(isNaN(d))return iso; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
</script>
</body>
</html>
